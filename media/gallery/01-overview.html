<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forever ADF – Overview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=block">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame"></div>

<div class="copy" style="gap: 30px;">
  <img src="../logo.png" alt="" style="width: 150px; height: 150px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6));">
  <h1 style="font-size: 92px; color: var(--gold);">Forever ADF</h1>
  <p style="font-family: 'Friz', serif; font-size: 40px; color: #fff;">Which debuffs are on the boss?</p>
  <p>One look tells you if Sunder Armor, Faerie Fire and the curses are up, with stacks and time left. Also in combat.</p>
  <p class="note">For World of Warcraft: Forever</p>
</div>
<div class="stage">
  <div class="scene">
    <div class="unit">
      <div class="name"><span>Ragnaros</span><span>71%</span></div>
      <div class="bar"><i></i></div>
    </div>
    <div class="adf">
      <div class="slot"><img src="icons/ability_warrior_sunder.jpg" alt=""><em>24</em><b>5</b></div>
      <div class="slot off"><img src="icons/ability_warrior_riposte.jpg" alt=""></div>
      <div class="slot"><img src="icons/spell_nature_faeriefire.jpg" alt=""><em>33</em></div>
      <div class="slot"><img src="icons/spell_shadow_unholystrength.jpg" alt=""><em>1m</em></div>
      <div class="slot off"><img src="icons/inv_axe_12.jpg" alt=""></div>
      <div class="slot"><img src="icons/spell_fire_soulburn.jpg" alt=""><em>18</em><b>3</b></div>
      <div class="slot off"><img src="icons/spell_frost_chillingblast.jpg" alt=""></div>
      <div class="slot"><img src="icons/spell_shadow_shadowbolt.jpg" alt=""><em>9</em><b>4</b></div>
      <div class="slot"><img src="icons/spell_shadow_blackplague.jpg" alt=""><em>12</em><b>5</b></div>
      <div class="slot off"><img src="icons/spell_holy_elunesgrace.jpg" alt=""></div>
    </div>
    <div class="legend"><span><i></i>on the target</span><span><i class="off"></i>missing</span></div>
  </div>
</div>
</body>
</html>
