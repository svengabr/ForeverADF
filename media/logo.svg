<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Forever ADF: four debuff slots, three lit and one missing. Drawn by hand, no game assets. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2b2f3a"/><stop offset="1" stop-color="#12141a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27e"/><stop offset=".5" stop-color="#8a5a2b"/><stop offset="1" stop-color="#e2b56a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8502c"/><stop offset=".6" stop-color="#8f2a1a"/><stop offset="1" stop-color="#4f140e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a56c9"/><stop offset=".6" stop-color="#5a2f96"/><stop offset="1" stop-color="#2c1552"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fc9"/><stop offset=".6" stop-color="#22609a"/><stop offset="1" stop-color="#0f2f55"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e6"/><stop offset=".55" stop-color="#b9b7ad"/><stop offset="1" stop-color="#77756d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#e8b53a"/><stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
    <radialGradient id="glow" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".30"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <!-- one snowflake arm, pointing up from the centre -->
    <g id="arm" fill="none" stroke="#f2f8ff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 V -56"/>
      <path d="M-17 -50 L 0 -33 L 17 -50"/>
    </g>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="64" fill="none" stroke="#c9a45c" stroke-opacity=".55" stroke-width="4"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- slot 1: armor sundered (lit) -->
  <rect x="70" y="70" width="176" height="176" rx="22" fill="url(#rim)" stroke="#2a1708" stroke-width="5"/>
  <rect x="84" y="84" width="148" height="148" rx="12" fill="url(#red)" stroke="#2a1708" stroke-width="4"/>
  <path d="M158 104 C 180 113 198 115 212 113 C 213 160 198 194 158 214 C 118 194 103 160 104 113 C 118 115 136 113 158 104 Z"
        fill="url(#steel)" stroke="#2a1708" stroke-width="5" stroke-linejoin="round"/>
  <path d="M166 106 L 148 140 L 172 156 L 146 184 L 158 214" fill="none" stroke="#2a1708" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 106 L 148 140 L 172 156 L 146 184 L 158 214" fill="none" stroke="#ff9a5c" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- slot 2: faerie fire (lit) -->
  <rect x="266" y="70" width="176" height="176" rx="22" fill="url(#rim)" stroke="#2a1708" stroke-width="5"/>
  <rect x="280" y="84" width="148" height="148" rx="12" fill="url(#violet)" stroke="#2a1708" stroke-width="4"/>
  <g fill="#fbeaff" stroke="#2a1708" stroke-width="5" stroke-linejoin="round">
    <path d="M346 104 Q 353 153 402 160 Q 353 167 346 216 Q 339 167 290 160 Q 339 153 346 104 Z"/>
    <path d="M398 100 Q 401 117 418 120 Q 401 123 398 140 Q 395 123 378 120 Q 395 117 398 100 Z" stroke-width="4"/>
    <path d="M400 180 Q 402 193 415 195 Q 402 197 400 210 Q 398 197 385 195 Q 398 193 400 180 Z" stroke-width="4"/>
  </g>

  <!-- slot 3: missing (dark) -->
  <rect x="70" y="266" width="176" height="176" rx="22" fill="#3a3630" stroke="#17130d" stroke-width="5"/>
  <rect x="84" y="280" width="148" height="148" rx="12" fill="#17191f" stroke="#0c0d10" stroke-width="4"/>
  <path d="M160 300 C 182 326 196 344 196 368 C 196 392 180 408 158 408 C 136 408 120 392 120 368 C 120 352 128 340 138 330 C 142 344 148 348 152 342 C 158 328 156 314 160 300 Z"
        fill="#2c2f38" stroke="#3d414c" stroke-width="5" stroke-linejoin="round"/>

  <!-- slot 4: winter's chill (lit) -->
  <rect x="266" y="266" width="176" height="176" rx="22" fill="url(#rim)" stroke="#2a1708" stroke-width="5"/>
  <rect x="280" y="280" width="148" height="148" rx="12" fill="url(#blue)" stroke="#2a1708" stroke-width="4"/>
  <g transform="translate(354 354)">
    <g stroke="#2a1708" opacity=".0"/>
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
    <circle r="9" fill="#f2f8ff"/>
  </g>
</svg>
